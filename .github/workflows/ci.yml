# Continuous integration: build and test every platform on any change to main, whether
# pushed or merged (a merge is a push).  Packaging stays in release.yml, run by hand.
#
#   Windows  x64 and ARM64 and Win32 on Server 2025, x64 also on Server 2022
#   macOS    universal on 15 and 26, tested as both Apple Silicon and Intel
#   Linux    x86-64 and AArch64, on 24.04 and 26.04.  Not 22.04: its wxWidgets is 3.0,
#            and the port needs 3.2.
#
# Runner labels: every one used here (ubuntu-24.04, ubuntu-24.04-arm, ubuntu-26.04,
# ubuntu-26.04-arm, macos-15, macos-26, windows-2022, windows-2025, windows-11-arm) was
# in GitHub's list of hosted runners, none marked preview, as of 2026-11-20.
#
# The first run of each job builds its dependencies from source, and takes a couple
# of hours on macOS.  Each dependency is cached on its own, as soon as its step has
# succeeded, so that a later step failing (the build, a test) doesn't throw the work
# away; and only when its step succeeded, so that a half-built one is never kept as
# if it were whole.  The keys are the scripts that build them, and the settings below.

name: CI

on:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push makes an older run of the same branch pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # OpenSSL's version, pinned, rather than looked up through GitHub's API on every run
  # (unauthenticated, and rate-limited per runner address).  The 3.5 LTS release the
  # packages ship; raise it here for a security release.
  OPENSSL_VERSION: "3.5.9"

jobs:
  # ── The quick checks: seconds, and they need no build ────────────────────────
  checks:
    name: Source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conflict markers, ASCII literals, test helpers, doc sections
        run: |
          python3 tests/check_conflict_markers.py
          python3 tests/check_ascii_literals.py
          python3 tests/check_duplicate_test_helpers.py
          python3 tests/check_doc_sections.py
      - name: Windows test project lists every engine source
        run: python3 tests/check_win_test_sources.py
      - name: Bundled plugin list matches the installer
        run: python3 tests/check_bundled_plugins.py

  # ── Windows ──────────────────────────────────────────────────────────────────
  # run_tests.ps1 builds the test executable and runs every suite, each in its own
  # process.  Then the Release client, for the engines selftest with real
  # interpreters.  Win32 embeds no engines, so it has no selftest and no fetch-deps.
  windows:
    name: Windows ${{ matrix.platform }} (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: x64,   arch: x64,   runner: windows-2025 }
          - { platform: ARM64, arch: arm64, runner: windows-11-arm }
          - { platform: Win32, arch: "",    runner: windows-2025 }
          - { platform: x64,   arch: x64,   runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: OpenSSL build prerequisites (Strawberry Perl; NASM for x64)
        if: matrix.arch != ''
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue) -or -not ((perl -v) -match 'MSWin32')) {
            choco install strawberryperl -y --no-progress
          }
          "C:\Strawberry\perl\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          if ('${{ matrix.arch }}' -eq 'x64') {
            choco install nasm -y --no-progress
            "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }

      - name: Restore the from-source dependencies
        id: deps-cache
        if: matrix.arch != ''
        uses: actions/cache/restore@v4
        with:
          path: |
            packaging/windows/deps/${{ matrix.platform }}
            packaging/windows/deps/common
          key: windows-${{ matrix.runner }}-${{ matrix.platform }}-deps-openssl${{ env.OPENSSL_VERSION }}-${{ hashFiles('packaging/windows/fetch-deps.ps1') }}

      - name: Dependencies
        id: deps
        if: matrix.arch != ''
        run: packaging\windows\fetch-deps.ps1 -Arch ${{ matrix.arch }} -OpenSslVersion $env:OPENSSL_VERSION -StageTo WinDebug-${{ matrix.platform }}

      - name: Save the from-source dependencies
        if: always() && steps.deps.outcome == 'success' && steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            packaging/windows/deps/${{ matrix.platform }}
            packaging/windows/deps/common
          key: ${{ steps.deps-cache.outputs.cache-primary-key }}

      - name: Tests
        run: tests\win\run_tests.ps1 -Platform ${{ matrix.platform }}

      # The package script builds Release, makes the zip, checks it is self-contained
      # and runs every scripting language's selftest from the extracted package.
      - name: Release build and the engines selftest
        if: matrix.arch != ''
        run: |
          $version = (Select-String -Path src\version.h -Pattern '#define VERSION_STRING "(.*)"').Matches[0].Groups[1].Value
          packaging\windows\build-app.ps1 -Arch ${{ matrix.arch }} -Version $version -SkipDeps -OutDir out

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.platform }}-${{ matrix.runner }}-logs
          path: |
            out/*-selftest.txt
            WinTest*/*.log
          if-no-files-found: ignore

  # ── macOS ────────────────────────────────────────────────────────────────────
  # Each dependency: restore it, build it if the cache had nothing, and save it the
  # moment it is built.  build-app.sh then runs each fetch script again, which finds
  # it current and does nothing (or rebuilds it, if a restored one is stale).
  macos:
    name: macOS (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15 }
          - { runner: macos-26 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    env:
      # What the package runs on; the fetch scripts and build-app.sh build for these,
      # and they are part of every cache key.
      MACOS_MIN: "11.0"
      MACOS_ARCHS: "arm64 x86_64"
    steps:
      - uses: actions/checkout@v4

      - name: Rosetta 2 (builds Ruby's Intel half natively, and runs the Intel tests)
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      # OpenSSL first: Ruby links it.
      - name: Restore OpenSSL
        id: openssl-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/openssl/install
          key: ${{ matrix.runner }}-openssl-${{ env.OPENSSL_VERSION }}-${{ env.MACOS_MIN }}-${{ hashFiles('packaging/fetch-openssl.sh') }}
      - name: OpenSSL
        id: openssl
        if: steps.openssl-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-openssl.sh
      - name: Save OpenSSL
        if: always() && steps.openssl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/openssl/install
          key: ${{ steps.openssl-cache.outputs.cache-primary-key }}

      - name: Restore wxWidgets
        id: wx-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/wx/install
          key: ${{ matrix.runner }}-wx-${{ env.MACOS_MIN }}-${{ hashFiles('packaging/fetch-wx.sh') }}
      - name: wxWidgets
        id: wx
        if: steps.wx-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-wx.sh
      - name: Save wxWidgets
        if: always() && steps.wx.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/wx/install
          key: ${{ steps.wx-cache.outputs.cache-primary-key }}

      - name: Restore Tcl
        id: tcl-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/tcl/install
          key: ${{ matrix.runner }}-tcl-${{ env.MACOS_MIN }}-${{ hashFiles('packaging/fetch-tcl.sh') }}
      - name: Tcl
        id: tcl
        if: steps.tcl-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-tcl.sh
      - name: Save Tcl
        if: always() && steps.tcl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/tcl/install
          key: ${{ steps.tcl-cache.outputs.cache-primary-key }}

      - name: Restore Python
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/python/Python.framework
          key: ${{ matrix.runner }}-python-${{ hashFiles('packaging/fetch-python.sh') }}
      - name: Python (python.org's framework)
        id: python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-python.sh
      - name: Save Python
        if: always() && steps.python.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/python/Python.framework
          key: ${{ steps.python-cache.outputs.cache-primary-key }}

      - name: Restore Ruby
        id: ruby-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packaging/ruby/install
            packaging/ruby/deps
          key: ${{ matrix.runner }}-ruby-openssl${{ env.OPENSSL_VERSION }}-${{ env.MACOS_MIN }}-${{ hashFiles('packaging/fetch-ruby.sh', 'packaging/fetch-openssl.sh') }}
      - name: Ruby (linked against the OpenSSL above)
        id: ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-ruby.sh
      - name: Save Ruby
        if: always() && steps.ruby.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            packaging/ruby/install
            packaging/ruby/deps
          key: ${{ steps.ruby-cache.outputs.cache-primary-key }}

      - name: Build tools (llvm-rc)
        run: brew install llvm

      - name: Build the app (universal, macOS 11+)
        run: packaging/build-app.sh --no-dmg

      - name: Build the test suite (same settings)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DwxWidgets_CONFIG_EXECUTABLE="$PWD/packaging/wx/install/bin/wx-config" \
            -DMUSHCLIENT_BUNDLED_LUA=ON -DOPENSSL_ROOT_DIR="$PWD/packaging/openssl/install"
          cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Tests (Apple Silicon)
        run: ctest --test-dir build -j"$(sysctl -n hw.ncpu)" --output-on-failure

      - name: Tests (Intel, the x86_64 half under Rosetta)
        run: python3 tools/ctest-arch.py build x86_64 -j"$(sysctl -n hw.ncpu)"

  # ── Linux ────────────────────────────────────────────────────────────────────
  linux:
    name: Linux (${{ matrix.runner }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04 }
          - { runner: ubuntu-24.04-arm }
          - { runner: ubuntu-26.04 }
          - { runner: ubuntu-26.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config xz-utils dpkg-dev file patchelf \
            libwxgtk3.2-dev liblua5.1-0-dev libasound2-dev libssl-dev zlib1g-dev libffi-dev \
            libperl-dev libjavascriptcoregtk-4.1-dev \
            llvm clang \
            xvfb xauth

      # The from-source runtimes, each cached as soon as it is built (see macOS).
      # Ruby links the system OpenSSL, so it is keyed on the runner (its image).
      - name: Restore Tcl
        id: tcl-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/tcl/install
          key: ${{ matrix.runner }}-tcl-${{ hashFiles('packaging/fetch-tcl.sh') }}
      - name: Tcl
        id: tcl
        if: steps.tcl-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-tcl.sh
      - name: Save Tcl
        if: always() && steps.tcl.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/tcl/install
          key: ${{ steps.tcl-cache.outputs.cache-primary-key }}

      - name: Restore Ruby
        id: ruby-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            packaging/ruby/install
            packaging/ruby/deps
          key: ${{ matrix.runner }}-ruby-${{ hashFiles('packaging/fetch-ruby.sh') }}
      - name: Ruby
        id: ruby
        if: steps.ruby-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-ruby.sh
      - name: Save Ruby
        if: always() && steps.ruby.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            packaging/ruby/install
            packaging/ruby/deps
          key: ${{ steps.ruby-cache.outputs.cache-primary-key }}

      - name: Restore Python
        id: python-cache
        uses: actions/cache/restore@v4
        with:
          path: packaging/python/install
          key: ${{ matrix.runner }}-python-${{ hashFiles('packaging/fetch-python.sh') }}
      - name: Python (python-build-standalone)
        id: python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: packaging/fetch-python.sh
      - name: Save Python
        if: always() && steps.python.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: packaging/python/install
          key: ${{ steps.python-cache.outputs.cache-primary-key }}

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j"$(nproc)"

      - name: Tests (under a virtual X display)
        run: xvfb-run -a ctest --test-dir build -j"$(nproc)" --output-on-failure
